services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: customer_behavior
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres -d customer_behavior
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    command: >
      sh -c "python -m src.data.init_db &&
      uvicorn api.main:app
      --host 0.0.0.0
      --port 8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/customer_behavior
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  dashboard:
    build: .
    command: >
      streamlit run frontend/dashboard.py
      --server.address 0.0.0.0
      --server.port 8501
    ports:
      - "8501:8501"
    depends_on:
      - api

volumes:
  postgres_data: